name: Temporary NSAMDR V17.6 frozen source recovery validation

on:
  push:
    branches:
      - nsamdr-v176-restore-frozen-eve-source-temp

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a80d267c2faba5591539dfdacf9f661695cda092
          fetch-depth: 0
      - name: Syntax and diff validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/nsamdr/neural/v17/diversity_corpus.py tools/nsamdr/neural/test_nsamdr_v17_5_diversity_corpus.py
          git diff --check b66167ff52236df449dad3fc4284b4b426dc6b73..HEAD
      - name: Standard-library recovery microtest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import tempfile
          from types import SimpleNamespace
          import urllib.request

          path=Path("tools/nsamdr/neural/v17/diversity_corpus.py")
          tree=ast.parse(path.read_text(encoding="utf-8"))
          wanted={"canonical_logical","sha256_file","_cdn_resource_suffix","_restore_missing_frozen_source"}
          nodes=[node for node in tree.body if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in wanted]
          assert {node.name for node in nodes}==wanted
          module=ast.Module(body=nodes,type_ignores=[])
          ast.fix_missing_locations(module)
          ns={
              "Path":Path,"hashlib":hashlib,"json":json,"os":os,"tempfile":tempfile,
              "urllib":SimpleNamespace(request=urllib.request),
              "RESOURCE_CDN_BASE":"https://resources.eveonline.com",
          }
          exec(compile(module,str(path),"exec"),ns)

          payload=b"frozen-authored-source"
          with tempfile.TemporaryDirectory() as tmp:
              target=Path(tmp)/"SharedCache"/"ResFiles"/"ab"/"abcdef012345"
              logical="res:/model/ship/a/b/normal.dds"
              frozen={"path":str(target.resolve()),"logical":logical,
                      "sha256":hashlib.sha256(payload).hexdigest()}
              source={"path":str(target),"logical":logical}
              calls=[]
              class Response(io.BytesIO):
                  pass
              old=urllib.request.urlopen
              urllib.request.urlopen=lambda request,timeout=0: (calls.append((request.full_url,timeout)) or Response(payload))
              try:
                  assert ns["_restore_missing_frozen_source"]("crop_000","normal",source,frozen)
              finally:
                  urllib.request.urlopen=old
              assert target.read_bytes()==payload
              assert calls==[("https://resources.eveonline.com/ab/abcdef012345",120)]

          with tempfile.TemporaryDirectory() as tmp:
              target=Path(tmp)/"ResFiles"/"cd"/"bad"
              logical="res:/model/ship/a/b/normal.dds"
              frozen={"path":str(target.resolve()),"logical":logical,
                      "sha256":hashlib.sha256(b"expected").hexdigest()}
              source={"path":str(target),"logical":logical}
              old=urllib.request.urlopen
              urllib.request.urlopen=lambda request,timeout=0: Response(b"wrong")
              try:
                  try:
                      ns["_restore_missing_frozen_source"]("crop_000","normal",source,frozen)
                  except RuntimeError as exc:
                      assert "SHA mismatch" in str(exc)
                  else:
                      raise AssertionError("wrong CDN bytes were accepted")
              finally:
                  urllib.request.urlopen=old
              assert not target.exists()
          print("frozen source recovery microtest passed")
          PY
