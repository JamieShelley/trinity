name: NSAMDR V12.4 clean validation temp
on:
  push:
    branches: [nsamdr-v124-clean-validation-temp]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile production delta
        run: python -m py_compile tools/nsamdr/neural/v9/local_boundary_production_contract.py tools/nsamdr/neural/v9/evolution/fitness.py tools/nsamdr/neural/v9/evolutionary_recovery.py tools/nsamdr/tests/test_v124_trainer_architecture_contract.py tools/nsamdr/tests/test_pass_driven_pipeline_contract.py
      - name: Install torch CPU
        run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install validation dependencies
        run: pip install -q numpy scipy pillow opencv-python-headless pytest
      - name: Exact trainer architecture validator
        run: python -m pytest -q tools/nsamdr/tests/test_v124_trainer_architecture_contract.py
      - name: V12 family contracts
        run: python -m pytest -q tools/nsamdr/tests/test_v117_baseline_relative_contract.py tools/nsamdr/tests/test_v120_explicit_geometry_refiner_contract.py tools/nsamdr/tests/test_v121_proposal_baseline_regret.py tools/nsamdr/tests/test_v121_refiner_telemetry_contract.py tools/nsamdr/tests/test_v122_evolution_proposal_contract.py tools/nsamdr/tests/test_v123_refiner_inference_context.py
      - name: Evolution and Quick contracts
        run: python -m pytest -q tools/nsamdr/tests/test_evolutionary_recovery_v114_contract.py tools/nsamdr/tests/test_raven_quick_budget_contract.py tools/nsamdr/tests/test_raven_quick_fast_structural_contract.py tools/nsamdr/tests/test_v117_quick_baseline_smoke.py tools/nsamdr/tests/test_raven_architecture_lock.py
      - name: Application contracts
        run: python -m pytest -q tools/nsamdr/tests/test_nsamdr_application_oop_contract.py tools/nsamdr/tests/test_nsamdr_oop_readability_contract.py
      - name: Pass-driven pipeline contract
        run: python -m pytest -q tools/nsamdr/tests/test_pass_driven_pipeline_contract.py
      - name: Commit diff hygiene
        run: git diff --check HEAD~1 HEAD
