name: NSAMDR V11.7 real Raven structure retry

on:
  push:
    branches:
      - nsamdr-v117-real-raven-structure-temp

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Record baseline readability
        shell: bash
        run: |
          python - <<'PY' > /tmp/readability-before.txt
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/nsamdr/neural')
          from nsamdr_readability_contract import check_file
          for failure in check_file(Path('tools/nsamdr/neural/v9/training.py')):
              print(failure)
          PY

      - name: Apply real-Raven structural training contract
        shell: bash
        run: python tools/nsamdr/_temp_real_raven_structure_patch.py

      - name: Validate source contracts
        shell: bash
        run: |
          python -m py_compile \
            tools/nsamdr/neural/v9/training.py \
            tools/nsamdr/tests/test_v117_baseline_relative_contract.py
          python - <<'PY'
          from pathlib import Path

          training = Path('tools/nsamdr/neural/v9/training.py').read_text(encoding='utf-8')
          test = Path('tools/nsamdr/tests/test_v117_baseline_relative_contract.py').read_text(encoding='utf-8')
          design = Path('tools/nsamdr/NSAMDR_BASELINE_RELATIVE_DESIGN.md').read_text(encoding='utf-8')
          required = (
              'authored_config.synthetic_geometry_probability = 0.0',
              'structural_train_dataset = PhysicalTileDatasetV9(',
              'phase in {"sdf-bootstrap", "sdf-proof"}',
              'epoch_loader = structural_train_loader',
              'structural_smoke_batch_limit = min(epoch_batch_count, 14)',
              'synthetic ladder remains validation-only',
          )
          for value in required:
              if value not in training:
                  raise SystemExit(f'missing real-Raven structural contract: {value}')
          forbidden = (
              'local_structure_train_dataset = ParametricPrimitiveTrainingDataset(',
              'local_structure_train_loader',
              '(2/class) before the full connected-spline bank',
          )
          for value in forbidden:
              if value in training:
                  raise SystemExit(f'stale synthetic production B1 authority remains: {value}')
          if 'test_connected_spline_b1_optimizes_real_raven_and_keeps_synthetic_audit' not in test:
              raise SystemExit('missing real-Raven B1 regression test')
          if 'Production B1a/B1b optimization uses authored Raven crops with synthetic geometry disabled.' not in design:
              raise SystemExit('baseline-relative design not updated')
          print('[v11.7-real-raven-structure] PASS')
          PY
          python - <<'PY' > /tmp/readability-after.txt
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/nsamdr/neural')
          from nsamdr_readability_contract import check_file
          for failure in check_file(Path('tools/nsamdr/neural/v9/training.py')):
              print(failure)
          PY
          diff -u /tmp/readability-before.txt /tmp/readability-after.txt
          git diff --check

      - name: Commit validated edit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Train connected-spline B1 on authored Raven"
          git push origin HEAD:nsamdr-v117-real-raven-structure-temp
