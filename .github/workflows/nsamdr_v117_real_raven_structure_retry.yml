name: NSAMDR V11.7 real Raven structure retry

on:
  push:
    branches:
      - nsamdr-v117-real-raven-structure-temp

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Record baseline readability
        shell: bash
        run: |
          python - <<'PY' > /tmp/readability-before.txt
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/nsamdr/neural')
          from nsamdr_readability_contract import check_file
          for failure in check_file(Path('tools/nsamdr/neural/v9/training.py')):
              print(failure)
          PY

      - name: Apply real-Raven structural training contract
        shell: bash
        run: |
          echo ' ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Validate source contracts
        shell: bash
        run: |
          python -m py_compile tools/nsamdr/neural/v9/training.py tools/nsamdr/tests/test_v117_baseline_relative_contract.py
          python - <<'PY'
          from pathlib import Path
          training = Path('tools/nsamdr/neural/v9/training.py').read_text(encoding='utf-8')
          design = Path('tools/nsamdr/NSAMDR_BASELINE_RELATIVE_DESIGN.md').read_text(encoding='utf-8')
          required = (
              'authored_config.synthetic_geometry_probability = 0.0',
              'structural_train_dataset = PhysicalTileDatasetV9(',
              'phase in {"sdf-bootstrap", "sdf-proof"}',
              'epoch_loader = structural_train_loader',
              'structural_smoke_batch_limit = min(epoch_batch_count, 14)',
              'synthetic ladder remains validation-only',
          )
          for value in required:
              assert value in training, value
          assert 'local_structure_train_dataset = ParametricPrimitiveTrainingDataset(' not in training
          assert 'local_structure_train_loader' not in training
          assert 'Production B1a/B1b optimization uses authored Raven crops with synthetic geometry disabled.' in design
          print('[v11.7-real-raven-structure] PASS')
          PY
          python - <<'PY' > /tmp/readability-after.txt
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/nsamdr/neural')
          from nsamdr_readability_contract import check_file
          for failure in check_file(Path('tools/nsamdr/neural/v9/training.py')):
              print(failure)
          PY
          diff -u /tmp/readability-before.txt /tmp/readability-after.txt
          git diff --check

      - name: Commit validated edit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Train connected-spline B1 on authored Raven"
          git push origin HEAD:nsamdr-v117-real-raven-structure-temp
