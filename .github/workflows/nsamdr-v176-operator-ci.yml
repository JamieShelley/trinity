name: NSAMDR V17.6 operator checks

on:
  push:
    branches: [NSAMDR]
    paths:
      - 'tools/nsamdr/gui/**'
      - 'tools/nsamdr/nsamdr_cli.py'
      - 'tools/nsamdr/test_nsamdr_cli.py'
      - 'tools/nsamdr/neural/render_nsamdr_v176_raven_preview.py'
      - 'tools/nsamdr/neural/v176/raven_renderer.py'
      - 'tools/nsamdr/neural/v177/**'
      - 'tools/nsamdr/neural/test_nsamdr_v177_material_coverage.py'
      - 'tools/nsamdr/neural/test_nsamdr_v177_baseline.py'
      - 'tools/nsamdr/neural/test_nsamdr_v177_enhancement.py'
      - 'tools/nsamdr/neural/train_nsamdr_v177_enhancement.py'
      - 'trinityal/tests/nsamdr/NSAMDRPreviewProcessing.cpp'
      - 'trinityal/tests/nsamdr/NSAMDRAssetProcessor.cpp'
      - 'trinityal/tests/nsamdr/NSAMDRPreview.hlsl'
      - 'trinityal/tests/nsamdr/NSAMDRPreviewPanel.cpp'
      - 'trinityal/tests/nsamdr/NSAMDRRenderPipeline.cpp'
      - 'trinityal/tests/nsamdr/NSAMDRPreviewTypes.h'
      - 'tools/nsamdr/neural/v176/channel_audit.py'
      - 'tools/nsamdr/neural/audit_nsamdr_v176_raven_channels.py'
      - 'tools/nsamdr/neural/test_nsamdr_v176_channel_audit.py'
      - 'tools/nsamdr/neural/test_nsamdr_v176_raven_preview.py'
      - 'scripts/build/nsamdr.bat'
      - '.github/workflows/nsamdr-v176-operator-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-smoke:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile current operator and all Python entrypoint sources
        shell: pwsh
        run: |
          python -m compileall -q tools/nsamdr/nsamdr_cli.py tools/nsamdr/gui/nsamdr_v176_workflow_gui.py tools/nsamdr/neural/render_nsamdr_v176_raven_preview.py tools/nsamdr/neural/v176/raven_renderer.py tools/nsamdr/neural/v177/semantic_baseline.py tools/nsamdr/neural/test_nsamdr_v177_baseline.py tools/nsamdr/neural/test_nsamdr_v177_enhancement.py tools/nsamdr/neural/train_nsamdr_v177_enhancement.py tools/nsamdr/neural/v177/enhancement_model.py tools/nsamdr/neural/v177/synthetic_geometry.py tools/nsamdr/neural/v177/material_coverage.py tools/nsamdr/neural/test_nsamdr_v177_material_coverage.py tools/nsamdr/neural/v176/channel_audit.py tools/nsamdr/neural/audit_nsamdr_v176_raven_channels.py tools/nsamdr/neural/test_nsamdr_v176_channel_audit.py tools/nsamdr/test_nsamdr_cli.py tools/nsamdr/gui/test_nsamdr_v176_workflow_gui.py tools/nsamdr/neural/test_nsamdr_v176_raven_preview.py
      - name: Assert sole supported GUI and legacy CLI removal
        shell: pwsh
        run: |
          python -c "from tools.nsamdr.nsamdr_cli import NSAMDRCommandLineApplication; p=NSAMDRCommandLineApplication().build_parser(); names=set(p._subparsers._group_actions[0].choices); expected={'gui','setup','v176-detail-proof','v176-capacity-proof','v176-raven-preview','v176-raven-channel-audit','v177-enhancement-train','test'}; assert names==expected,(names,expected); print('SOLE_V176_OPERATOR_SURFACE_VERIFIED')"
      - name: Run V17.6 operator GUI and CLI tests
        shell: pwsh
        run: |
          python -m unittest -v tools.nsamdr.test_nsamdr_cli tools.nsamdr.gui.test_nsamdr_v176_workflow_gui
      - name: Compile native DX11 material coverage pixel shader with Windows SDK
        shell: pwsh
        run: |
          $sdkBin = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\\10\\bin"
          $compiler = Get-ChildItem -LiteralPath $sdkBin -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\\fxc.exe" } |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $compiler) { throw "x64 Windows SDK FXC unavailable; cannot verify native shader" }
          $shader = "trinityal/tests/nsamdr/NSAMDRPreview.hlsl"
          & $compiler /nologo /T ps_5_0 /E PSMain /Fo "${env:RUNNER_TEMP}\\nsamdr_psmain.cso" $shader
          if ($LASTEXITCODE -ne 0) { throw "NSAMDR V17.7 PSMain shader compilation failed" }
          Write-Output "NSAMDR_V177_SHADER_COMPILED"
      - name: Verify active Raven bridge has no legacy model loader
        shell: pwsh
        run: |
          python -c "from pathlib import Path; p=Path('tools/nsamdr/neural/v176/raven_renderer.py').read_text(); assert 'def _load_model(' not in p and 'NSAMDR_V16_' not in p; print('V176_RENDERER_NO_LEGACY_MODEL_LOADER')"

  channel-audit-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install channel audit CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy opencv-python-headless pillow
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Exercise real native-channel audit on synthetic textures
        run: |
          python -m unittest -v tools.nsamdr.neural.test_nsamdr_v176_channel_audit tools.nsamdr.neural.test_nsamdr_v177_baseline tools.nsamdr.neural.test_nsamdr_v177_enhancement tools.nsamdr.neural.test_nsamdr_v177_material_coverage tools.nsamdr.neural.test_nsamdr_v176_raven_preview
      - name: Smoke run actual V17.7 training and checkpoint report emission
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.nsamdr.neural.train_nsamdr_v177_enhancement import main
          rc = main(["--device","cpu","--steps","2","--batch-size","1",
                     "--patch-size","16","--seed","91230","--resume","fresh"])
          assert rc in (0,2),rc
          directory=Path("artifacts/nsamdr/diagnostics/v177_native_enhancement/seed_91230_patch_16_batch_1")
          report=json.loads((directory/"report.json").read_text())
          assert report["trainingOnly"] and not report["productionPromotionAllowed"]
          assert (directory/"candidate.pt").is_file()
          assert (directory/"resume.pt").is_file()
          assert report["decision"] in ("SYNTHETIC_IMPROVEMENT_ONLY","SYNTHETIC_LEARNING_UNPROVEN")
          print("V177_SYNTHETIC_CHECKPOINT_GATE_OK",report["decision"])
          PY
