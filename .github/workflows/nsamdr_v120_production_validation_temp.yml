name: NSAMDR V12 clean production validation temp

on:
  push:
    branches:
      - nsamdr-v120-production-validation-temp

jobs:
  validate-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nsamdr-v120-production-validation-temp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile production sources
        run: |
          python -m py_compile \
            tools/nsamdr/neural/v9/model.py \
            tools/nsamdr/neural/v9/explicit_spline_refiner.py \
            tools/nsamdr/neural/v9/edge_constrained_spline_graph.py \
            tools/nsamdr/neural/v9/local_boundary_production_contract.py \
            tools/nsamdr/tests/test_v120_explicit_geometry_refiner_contract.py \
            tools/nsamdr/tests/test_v117_quick_baseline_smoke.py
      - name: Install validation dependencies
        run: |
          python -m pip install --quiet pytest numpy pillow opencv-python-headless
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Targeted contracts
        run: |
          python -m pytest -q tools/nsamdr/tests/test_v120_explicit_geometry_refiner_contract.py
          python -m pytest -q tools/nsamdr/tests/test_v117_baseline_relative_contract.py
          python -m pytest -q tools/nsamdr/tests/test_raven_quick_budget_contract.py
          python -m pytest -q tools/nsamdr/tests/test_v117_quick_baseline_smoke.py
          python -m pytest -q tools/nsamdr/tests/test_raven_quick_fast_structural_contract.py
      - name: Production proposal-gradient and detached-refiner proof
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import torch

          sys.path.insert(0, str(Path.cwd() / 'tools/nsamdr/neural'))
          from v9 import V9Config, FidelityResidualNetV9
          from v9.model import MODEL_SCHEMA

          assert MODEL_SCHEMA == 'NSAMDR_RAVEN_PRODUCTION_NEURAL_PROPOSAL_EXPLICIT_REFINER_SPLINE_GRAPH_4X_V12_0_0'
          config = V9Config()
          config.training_activation_checkpointing = False
          config.spline_refiner_steps = 2
          model = FidelityResidualNetV9(config)
          model.set_phase('sdf-proof')
          model.eval()

          refiner = model.geometry_net.production_structure.geometry_refiner
          assert sum(p.numel() for p in refiner.parameters()) == 0
          observed = {'calls': 0, 'masks_fixed': False}
          def hook(_module, args, output):
              observed['calls'] += 1
              proposal = args[1]
              observed['masks_fixed'] = bool(
                  torch.equal(output['spline_graph_mask_h'], proposal['spline_graph_mask_h'])
                  and torch.equal(output['spline_graph_mask_v'], proposal['spline_graph_mask_v'])
              )
          handle = refiner.register_forward_hook(hook)
          h = w = 16
          inputs = torch.zeros((1, 17, h, w), dtype=torch.float32)
          inputs[:, 0:3] = 0.5
          x = torch.linspace(-1.0, 1.0, w, dtype=torch.float32).view(1, 1, 1, w)
          inputs[:, 16:17] = x.expand(1, 1, h, w)
          outputs = model(inputs)
          handle.remove()
          assert observed == {'calls': 1, 'masks_fixed': True}, observed

          proposal_keys = (
              'spline_proposal_control_point_h_lr', 'spline_proposal_control_point_v_lr',
              'spline_proposal_control_tangent_h', 'spline_proposal_control_tangent_v',
          )
          refined_keys = (
              'spline_control_point_h_lr', 'spline_control_point_v_lr',
              'spline_control_tangent_h', 'spline_control_tangent_v',
          )
          assert all(outputs[key].requires_grad for key in proposal_keys)
          assert all(not outputs[key].requires_grad for key in refined_keys)

          loss = (
              outputs['spline_proposal_control_point_h_lr'][..., 0].square().mean()
              + outputs['spline_proposal_control_point_v_lr'][..., 1].square().mean()
              + 0.1 * outputs['spline_proposal_control_tangent_h'].square().mean()
              + 0.1 * outputs['spline_proposal_control_tangent_v'].square().mean()
          )
          model.zero_grad(set_to_none=True)
          loss.backward()
          geometry_head = model.geometry_net.production_structure.spline_graph.geometry_head
          grad_total = sum(
              float(p.grad.detach().abs().sum())
              for p in geometry_head.parameters() if p.grad is not None
          )
          assert grad_total > 0.0, grad_total
          print(f'clean production V12 proposal gradient L1={grad_total:.6f}')
          PY
      - name: Diff hygiene
        run: git diff --check
