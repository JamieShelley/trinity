name: Restore NSAMDR README presentation

on:
  push:
    branches:
      - nsamdr-readme-restore-temp
    paths:
      - .github/workflows/nsamdr-readme-restore.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: nsamdr-readme-restore-temp
          fetch-depth: 0

      - name: Restore pre-genetic README and add genetic explanation
        env:
          OLD_README_COMMIT: a4a7ebcdc0fc780f35c79e16a8b211d961a3fa58
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          old_commit = os.environ['OLD_README_COMMIT']
          path = Path('tools/nsamdr/README.md')
          readme = subprocess.check_output(
              ['git', 'show', f'{old_commit}:tools/nsamdr/README.md'],
              text=True,
          )

          heading = '# NSAMDR production workflow\n\n'
          if not readme.startswith(heading):
              raise SystemExit('Unexpected historical README heading')

          quick_start = r'''# NSAMDR production workflow

## Quick start

From the Trinity repository root, launch the workflow GUI directly with the managed NSAMDR Python environment:

```bat
artifacts\nsamdr\python-env\Scripts\python.exe tools\nsamdr\gui\nsamdr_v9_workflow_gui.py
```

The standard launcher remains available:

```bat
scripts\build\run_nsamdr_v9_gui.bat
```

[![NSAMDR example reconstruction](./EXAMPLE.png)](./EXAMPLE.png)

'''
          readme = quick_start + readme[len(heading):]

          graph_start_marker = 'The current production graph is conceptually:\n\n'
          graph_end_marker = 'The structural path and appearance path deliberately have different jobs.'
          graph_start = readme.find(graph_start_marker)
          graph_end = readme.find(graph_end_marker, graph_start)
          if graph_start < 0 or graph_end < 0:
              raise SystemExit('Could not locate historical production-flow diagram')
          production_prose = (
              'The production path runs the authored LR physical maps and guidance through '
              '`GeometryNet`, the continuous structural/SDF representation, deterministic '
              'boundary redraw, `BoundaryProfileSpecialist`, `PhaseAwareSeamSR`, the '
              'geometry-conditioned `DetailNet`, the explicit 2x-to-4x decoder, aligned '
              'physical-map heads, confidence/regret estimation, and finally '
              '`BenefitSelector`. All reconstructed physical maps share the accepted '
              'structural authority.\n\n'
          )
          readme = readme[:graph_start] + production_prose + readme[graph_end:]

          architecture_note = (
              'The diagram is a compact view of the executable contract. The authoritative\n'
              'machine-readable evidence for an experiment is\n'
              '`architecture_participation.json`, produced by instrumenting the real forward\n'
              'graph before and after training.\n'
          )
          if architecture_note not in readme:
              raise SystemExit('Could not locate historical architecture-image explanation')

          genetic = r'''

### Genetic / evolutionary recovery

V11.4 adds a **training-only bounded evolutionary recovery controller** around the existing production structural representation. It does not create a second Raven network, substitute a different inference path, weaken a qualification gate, or change the final output contract. Evolution searches only a small bounded genome of authorities already present inside the production model.

The controller first classifies the reason a structural attempt failed:

| Failure class | Typical examples | Response |
| --- | --- | --- |
| **Software / contract** | missing attribute, invalid tensor shape, import/interface failure | Stop and preserve the error. No evolution. |
| **Numerical** | NaN, non-finite loss, CUDA OOM | Stop or use the normal runtime recovery path. Architecture evolution is not used to hide the error. |
| **Learning** | finite, structurally valid model with weak optimisation/generalisation | Normal bounded training failure; no architecture mutation by default. |
| **Representation** | topology regression, missing contours, negative structural gain, catastrophic structural mismatch | Bounded evolutionary recovery is allowed. |

The bounded production genome controls existing structural authorities such as `feature_gain`, `physical-evidence_gain`, `distance_scale`, `curvature_scale`, `ribbon_scale`, `extra_branch_gain`, `csg_logit_scale`, and `correction_scale`. Each field has a hard numeric range; mutation cannot add or remove networks or change output semantics.

Before expensive training, a small **real Raven capacity microproof** evaluates a small candidate population with only a few optimisation steps. It scores structural improvement, topology/sign regression, local SDF gradient error, correction magnitude, finite behaviour, and whether the production structural module actually learns. Synthetic line/circle/ring proofs remain structural sanity checks, but they do not replace the real-Raven evidence.

A structurally qualified winning genome is stored in the production state dictionary as `geometry_net.production_structure.evolution_genome`, with the last qualified repository-level seed recorded at `artifacts/nsamdr/evolution/locked_local_boundary_genome.json`. If B1/B2 later fails specifically as a representation failure, bounded recovery may retry the structural stage; downstream seam/detail/selector stages remain blocked until the unchanged production gate passes.

Production inference remains the same direct model call:

```python
outputs = model(inputs)
```

The evolutionary controller is training orchestration only and is not present in production inference.
'''
          readme = readme.replace(architecture_note, architecture_note + genetic, 1)

          layout_start = readme.find('## 11. Output directory layout\n')
          workflow_marker = 'The workflow also writes:\n'
          layout_end = readme.find(workflow_marker, layout_start)
          if layout_start < 0 or layout_end < 0:
              raise SystemExit('Could not locate historical output-layout section')
          section_header_end = layout_start + len('## 11. Output directory layout\n')
          layout_prose = r'''

Each experiment under `artifacts/nsamdr/experiments/EXP_####/` contains the resolved configuration, training log, architecture participation evidence, final manifest, metrics, checkpoints, evidence, and previews. The canonical final checkpoint files are `checkpoints/final/nsamdr_v9_fidelity.pt` and `checkpoints/final/nsamdr_v9_fidelity.json`.

'''
          readme = readme[:section_header_end] + layout_prose + readme[layout_end:]

          # The restored README should contain the two original embedded images,
          # not replace either with the later evolutionary diagram.
          required = [
              'artifacts\\nsamdr\\python-env\\Scripts\\python.exe tools\\nsamdr\\gui\\nsamdr_v9_workflow_gui.py',
              '[![NSAMDR example reconstruction](./EXAMPLE.png)](./EXAMPLE.png)',
              '[![NSAMDR production architecture](./NSAMDR_FULL_SYSTEM_ARCHITECTURE.png)](./NSAMDR_FULL_SYSTEM_ARCHITECTURE.png)',
              '### Genetic / evolutionary recovery',
          ]
          for token in required:
              if token not in readme:
                  raise SystemExit(f'Missing required restored README content: {token}')

          if 'NSAMDR_EVOLUTIONARY_RECOVERY_ARCHITECTURE.png' in readme:
              raise SystemExit('Evolutionary diagram unexpectedly referenced')
          if any(token in readme for token in ('├──', '└──', '+--', '│', '▼', '┌', '┐', '└', '┘')):
              raise SystemExit('ASCII/box-drawing diagram remains in README')
          if readme.count('[![') != 2:
              raise SystemExit(f'Expected exactly two embedded image links, found {readme.count("[![")}')

          path.write_text(readme, encoding='utf-8', newline='\n')
          PY

      - name: Validate restored README assets
        run: |
          test -f tools/nsamdr/EXAMPLE.png
          test -f tools/nsamdr/NSAMDR_FULL_SYSTEM_ARCHITECTURE.png
          grep -F 'artifacts\nsamdr\python-env\Scripts\python.exe tools\nsamdr\gui\nsamdr_v9_workflow_gui.py' tools/nsamdr/README.md
          grep -F './EXAMPLE.png' tools/nsamdr/README.md
          grep -F './NSAMDR_FULL_SYSTEM_ARCHITECTURE.png' tools/nsamdr/README.md
          grep -F 'Genetic / evolutionary recovery' tools/nsamdr/README.md
          if grep -F 'NSAMDR_EVOLUTIONARY_RECOVERY_ARCHITECTURE.png' tools/nsamdr/README.md; then exit 1; fi
          git diff --check

      - name: Commit only the README change to NSAMDR
        env:
          BASE: abe1ab58ee3970f2ce15e9b78672f84aa8ede9b4
        run: |
          rm -f .github/workflows/nsamdr-readme-restore.yml
          git config user.name 'ChatGPT NSAMDR README Restore'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          TREE_SHA=$(git write-tree)
          FINAL_SHA=$(printf '%s\n' 'Restore NSAMDR README quickstart and images' | git commit-tree "$TREE_SHA" -p "$BASE")
          git push origin "$FINAL_SHA:refs/heads/NSAMDR"
