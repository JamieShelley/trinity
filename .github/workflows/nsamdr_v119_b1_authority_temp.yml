name: NSAMDR V11.9 B1 authority temp

on:
  push:
    branches:
      - nsamdr-v119-b1-authority-temp

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nsamdr-v119-b1-authority-temp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate V11.9 readability and source contracts
        shell: bash
        run: |
          python -m py_compile \
            tools/nsamdr/neural/v9/local_boundary_production_contract.py \
            tools/nsamdr/neural/v9/edge_constrained_spline_graph.py \
            tools/nsamdr/neural/v9/application/baseline_relative_smoke.py \
            tools/nsamdr/neural/v9/application/pipeline.py \
            tools/nsamdr/tests/test_v117_baseline_relative_contract.py
          python - <<'PY'
          import sys
          from pathlib import Path
          tests = Path('tools/nsamdr/tests').resolve()
          sys.path.insert(0, str(tests))
          from test_nsamdr_application_oop_contract import TestNsamdrApplicationOopContract
          TestNsamdrApplicationOopContract().test_application_readability_contract()
          PY
          git diff --check HEAD~1 HEAD
